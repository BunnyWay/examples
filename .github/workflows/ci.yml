name: Build Changed Apps

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed apps
        id: set-matrix
        run: |
          # Get changed files in app-* directories, excluding READMEs
          CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD | \
            grep -E '^app-[^/]+/' | \
            grep -v 'README' | \
            cut -d'/' -f1 | \
            sort -u)

          # Convert to JSON array
          if [ -z "$CHANGED_DIRS" ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            JSON=$(echo "$CHANGED_DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix=$JSON" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

          echo "Changed apps: $CHANGED_DIRS"

  build-and-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/examples-${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/examples-${{ matrix.app }}:latest

      - name: Get App ID for this app
        id: app-config
        run: |
          # Convert app-express to APP_EXPRESS_ID
          VAR_NAME=$(echo "${{ matrix.app }}" | tr '[:lower:]-' '[:upper:]_')_ID
          echo "app_id_var=$VAR_NAME" >> $GITHUB_OUTPUT

      - name: Update container image on Magic Containers
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars[steps.app-config.outputs.app_id_var] }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: app
          image_tag: ${{ github.sha }}
